<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Conversione SOAP</title>
</head>
<body>

<h1>Conversione SOAP</h1>

<form id="conversionForm">
    <label>Valore:</label>
    <input type="number" id="value" step="any" required>
    <br><br>

    <label>Tipo di conversione:</label>
    <select id="type" required>
        <option value="celsius_to_fahrenheit">Celsius → Fahrenheit</option>
        <option value="fahrenheit_to_celsius">Fahrenheit → Celsius</option>
        <option value="meters_to_feet">Metri → Piedi</option>
        <option value="feet_to_meters">Piedi → Metri</option>
    </select>
    <br><br>

    <button type="submit">Converti</button>
</form>

<h2>Risultato: <span id="result"></span></h2>

<script>
document.getElementById('conversionForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const value = parseFloat(document.getElementById('value').value);
    const type = document.getElementById('type').value;

    fetch('do_action.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({value, type})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('result').textContent = data.result;
    })
    .catch(() => {
        document.getElementById('result').textContent = 'Errore nella richiesta';
    });
});
</script>

</body>
</html>
